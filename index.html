<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A little travel journal with packing checklists and outfit ideas for your next getaway.">
  <title>Pack With Me</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="journal">
    <header class="masthead">
      <div class="wordmark"><span aria-hidden="true">✦</span> The Packing Journal</div>
    </header>
    <section class="hero" aria-labelledby="title">
      <div>
        <h1 id="title">Pack <em>With Me.</em></h1>
        <p>A little planning for wherever you’re headed.</p>
      </div>
      <div class="postmark" aria-hidden="true"><span>✈</span></div>
    </section>
    <section class="destinations" aria-labelledby="trip-label">
      <h2 id="trip-label">Where are we going?</h2>
      <div id="trips" role="group" aria-labelledby="trip-label">
        <button id="create-trip" type="button"><span aria-hidden="true">+</span> Create My Own Trip</button>
      </div>
    </section>
    <div class="spread">
      <section class="packing panel" aria-labelledby="packing-title">
        <div class="section-heading">
          <h2 id="packing-title">Packing Checklist</h2>
          <span id="trip-name" class="trip-name"></span>
        </div>
        <div class="progress">
          <div class="suitcase" aria-hidden="true"><div id="fill"></div><i></i><i></i></div>
          <div role="status"><strong id="count"></strong><p id="hint"></p></div>
        </div>
        <form id="add-form" class="entry-form">
          <label class="visually-hidden" for="item-name">Add an item</label>
          <input id="item-name" type="text" placeholder="+ Add an item" maxlength="100" required>
          <button class="primary" type="submit">Add</button>
        </form>
        <p id="empty-list" hidden>Your list is empty. Add your first item to start packing.</p>
        <div id="checklist"></div>
        <button id="reset" type="button">↻ &nbsp; Reset checklist</button>
      </section>
      <section class="outfits" aria-labelledby="outfit-title">
        <h2 id="outfit-title">Outfit Edit</h2>
        <div id="looks"></div>
      </section>
    </div>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form">
      <h2 id="editor-title"></h2>
      <label id="editor-label" for="editor-name"></label>
      <input id="editor-name" type="text" maxlength="100" required autofocus>
      <div class="editor-actions">
        <button id="editor-cancel" type="button">Cancel</button>
        <button class="primary" id="editor-submit" type="submit"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
